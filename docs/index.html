<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Radar Lucía</title>
<style>
  :root{
    --bg:#fff6f8; --bg2:#ffedf2; --card:#ffffff; --card2:#fffafb;
    --text:#3b1f2b; --muted:#8a6577; --line:#f6dde5; --line2:#eec9d6;
    --accent:#c72a63; --accent-2:#ec6a95; --accent-bg:#ffe3ec; --accent-ink:#ffffff;
    --ok:#157a55; --ok-bg:#dff5ea; --warn:#a05a00; --warn-bg:#fff0d6; --bad:#b4233b; --bad-bg:#fde1e6;
    --t-cuentas:#3b5bdb; --t-cuentas-bg:#e7edff;
    --t-eventos:#8a3ffc; --t-eventos-bg:#f1e6ff;
    --t-marketing:#0e7c6b; --t-marketing-bg:#dcf5ef;
    --shadow:0 12px 32px -18px rgba(199,42,99,.35);
    --glow:#ffdce7;
    --r-lg:22px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#1d1017; --bg2:#2a1721; --card:#27151e; --card2:#2f1b26;
      --text:#fbe9f0; --muted:#c79cb0; --line:#43252f; --line2:#5b3242;
      --accent:#ff7aa8; --accent-2:#ff9ec0; --accent-bg:#4a2032; --accent-ink:#3a0b1d;
      --ok:#5fdca4; --ok-bg:#163a2c; --warn:#ffc15e; --warn-bg:#3d2c10; --bad:#ff8a9d; --bad-bg:#44202a;
      --t-cuentas:#9db4ff; --t-cuentas-bg:#1e2a4d;
      --t-eventos:#d3b0ff; --t-eventos-bg:#35224f;
      --t-marketing:#6fe0cc; --t-marketing-bg:#143a34;
      --shadow:0 12px 32px -18px rgba(0,0,0,.7);
      --glow:#3a1727;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--text);font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    background:radial-gradient(1100px 480px at 88% -8%,var(--glow) 0,transparent 62%),var(--bg);min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 90px}

  /* cabecera */
  header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .radar-mark{width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);position:relative;flex:none;
    background:radial-gradient(circle,var(--accent) 0 3px,transparent 4px),radial-gradient(circle,transparent 0 11px,var(--accent-2) 12px 13px,transparent 14px),var(--accent-bg)}
  .radar-mark::after{content:"";position:absolute;left:50%;top:50%;width:46%;height:2px;background:var(--accent);transform-origin:0 50%;transform:rotate(-40deg)}
  .eyebrow{display:block;font-size:14px;color:var(--muted)}
  h1{margin:0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.015em}
  .actions{display:flex;flex-wrap:wrap;gap:8px}

  /* botones y campos */
  button,.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--text);
    padding:9px 18px;border-radius:999px;transition:background .15s,border-color .15s,box-shadow .15s}
  button:hover,.btn:hover{background:var(--accent-bg);border-color:var(--accent-2)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 8px 18px -10px var(--accent)}
  button.primary:hover{background:var(--accent);filter:brightness(1.06)}
  button.small,.btn.small{padding:5px 13px;font-size:13px}
  button.danger:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
  button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  :focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
  input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-bg)}
  textarea{resize:vertical;line-height:1.45}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 5px}
  a{color:var(--accent)}

  /* indicadores y embudo */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
  .stat .ic{width:44px;height:44px;border-radius:15px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;flex:none}
  .stat .n{display:block;font-size:30px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat .l{font-size:13px;color:var(--muted);margin-top:4px;display:block}
  .stat.hot{border-color:var(--accent-2);background:linear-gradient(135deg,var(--card),var(--accent-bg))}
  .funnel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin:14px 0 24px;box-shadow:var(--shadow)}
  .funnel h2{font-size:15px;font-weight:650;margin:0 0 14px;display:flex;justify-content:space-between;gap:10px}
  .funnel h2 span{font-weight:500;color:var(--muted);font-size:13px}
  .fwrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
  .fcol{flex:var(--w) 1 0;min-width:92px;border:0;background:none;padding:0;text-align:left;border-radius:12px;cursor:pointer}
  .fcol:hover{background:none}
  .fcol .b{height:14px;border-radius:999px;background:var(--c);transition:filter .15s}
  .fcol:hover .b{filter:brightness(.93)}
  .fcol.off .b{opacity:.35}
  .fcol .t{display:block;margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:500}
  .fcol .t b{display:block;font-size:19px;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}

  /* estructura */
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:24px;align-items:start}
  aside{position:sticky;top:16px}
  .views{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;display:inline-flex;gap:2px;margin-bottom:16px}
  .views button{border:0;background:transparent;padding:8px 22px;color:var(--muted)}
  .views button:hover{background:transparent;color:var(--text)}
  .views button.active{background:var(--card);color:var(--accent);box-shadow:0 4px 12px -6px rgba(199,42,99,.5)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .toolbar input{flex:1 1 220px;width:auto}
  .toolbar select{width:auto}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tabs button{padding:6px 14px;font-size:13px;font-weight:600;background:var(--card)}
  .tabs button.active{background:var(--accent-bg);border-color:var(--accent-2);color:var(--accent)}
  .views button.active{background:var(--card);border-color:transparent}

  /* lista en un solo panel */
  #list,#offList{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
  .lead{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);transition:background .15s}
  .lead:last-child{border-bottom:0}
  .lead:hover{background:var(--card2)}
  .lead h3{margin:0;font-size:16px;font-weight:650;line-height:1.3}
  .meta{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-word}
  .notes{font-size:13px;margin-top:6px;line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg2);color:var(--muted)}
  .chip.cuentas{background:var(--t-cuentas-bg);color:var(--t-cuentas)}
  .chip.eventos{background:var(--t-eventos-bg);color:var(--t-eventos)}
  .chip.marketing{background:var(--t-marketing-bg);color:var(--t-marketing)}
  .chip.due{background:var(--warn-bg);color:var(--warn)}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.bad{background:var(--bad-bg);color:var(--bad)}
  .lead .btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
  .lead select{width:auto;padding:5px 10px;font-size:13px;border-radius:999px}
  .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;background:var(--accent-bg);color:var(--accent);position:relative}
  .av.cuentas{background:var(--t-cuentas-bg);color:var(--t-cuentas)}
  .av.eventos{background:var(--t-eventos-bg);color:var(--t-eventos)}
  .av.marketing{background:var(--t-marketing-bg);color:var(--t-marketing)}
  .av.ring{background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
  .av.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card)}
  .av.ring span{position:relative;font-size:15px}
  .mailbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}
  .mailbox h2{font-size:18px;margin:0 0 4px;font-weight:700}
  .mailbox textarea{min-height:260px}
  .savedline{font-size:13px;color:var(--muted);min-height:20px;margin-top:6px}
  .prevbox{margin-top:8px;border-top:1px solid var(--line)}
  .prevbox summary{cursor:pointer;font-weight:600;font-size:14px;padding:10px 0}
  .chk-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .chk-item:first-of-type{border-top:0}
  .chk-item .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .chk-item.ok .dot{background:var(--ok-bg);color:var(--ok)}
  .chk-item.no .dot{background:var(--warn-bg);color:var(--warn)}
  .chk-item span:nth-child(2){flex:1}
  .searchrow{display:flex;gap:10px;margin-top:12px}
  .searchrow input{flex:1;font-size:15px;padding:12px 18px;border-radius:999px}
  .sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chipbtn{font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--bg2);color:var(--accent);border:1px solid var(--line2)}
  .aopts{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:12px;font-size:13px}
  .aopts label{margin:0;display:flex;align-items:center;gap:6px;color:var(--text);font-weight:500}
  .aopts input{width:auto}
  .aopts select{width:auto;padding:5px 12px;border-radius:999px}
  .usage{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .usage .ut{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
  .usage .track{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden}
  .usage .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
  .empty{text-align:center;color:var(--muted);padding:52px 20px}
  .empty strong{color:var(--text);font-size:16px}

  /* panel lateral */
  .side-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px 12px;box-shadow:var(--shadow);margin-bottom:16px}
  .side-card h2{font-size:15px;font-weight:650;margin:0 0 6px}
  .todo{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .todo:first-of-type{border-top:0}
  .todo .n{font-size:24px;font-weight:700;min-width:34px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
  .todo.zero .n{color:var(--line2)}
  .todo .t{flex:1;font-size:13px;line-height:1.35}
  .sbar{margin:0 0 12px}
  .sbar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .sbar .top span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
  .sbar .track{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden}
  .sbar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}

  /* ofertas */
  .offbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .offbar input[type=search]{flex:1 1 200px;width:auto}
  .offbar select{width:auto}
  .offbar label.chk{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--text);font-weight:500}
  .offbar label.chk input{width:auto}
  .offmeta{font-size:13px;color:var(--muted);margin-bottom:14px}

  /* ventanas */
  .overlay{position:fixed;inset:0;background:rgba(59,31,43,.42);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto;z-index:10}
  .overlay[hidden]{display:none}
  .modal{position:relative;background:var(--card);border-radius:var(--r-lg);max-width:700px;width:100%;padding:26px 26px 0;border:1px solid var(--line);box-shadow:0 34px 80px -24px rgba(59,31,43,.5)}
  .modal .x{position:absolute;top:16px;right:16px;width:36px;height:36px;padding:0;font-size:22px;line-height:1;border-radius:50%;display:grid;place-items:center}
  .modal h2{margin:0 40px 4px 0;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .modal .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;position:sticky;bottom:0;margin:22px -26px 0;padding:14px 26px;background:var(--card);border-top:1px solid var(--line);border-radius:0 0 var(--r-lg) var(--r-lg)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .sec{border:1px solid var(--line);border-radius:18px;padding:6px 18px 16px;margin-top:16px;background:var(--card2)}
  .sec>h3{font-size:15px;font-weight:650;margin:14px 0 2px}
  .sec details{border-top:1px solid var(--line);margin-top:10px}
  .sec details summary{cursor:pointer;font-weight:600;padding:10px 0;font-size:14px}
  .alert{border-radius:12px;padding:10px 14px;font-size:13px;margin-top:12px}
  .alert.bad{background:var(--bad-bg);color:var(--bad)}
  .alert.warn{background:var(--warn-bg);color:var(--warn)}
  .alert.ok{background:var(--ok-bg);color:var(--ok)}
  table.prev{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  table.prev td,table.prev th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;word-break:break-word}
  .hint{font-size:13px;color:var(--muted);margin-top:4px}
  .blist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-top:8px;background:var(--card2)}
  .blist label{display:flex;gap:8px;align-items:center;margin:0;padding:5px 0;color:var(--text);font-size:13px;font-weight:500}
  .blist input{width:auto}
  .srow{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
  .srow.ok{color:var(--ok)} .srow.err{color:var(--bad)}

  @media (max-width:1000px){
    .layout{grid-template-columns:1fr}
    aside{position:static}
  }
  @media (max-width:640px){
    .searchrow{flex-direction:column}
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat{padding:14px}
    .stat .n{font-size:26px}
    .fwrap{flex-wrap:wrap;overflow:visible;row-gap:14px}
    .fcol{flex:1 1 28%;min-width:0}
    .actions button{padding:8px 14px;font-size:14px}
    .row{grid-template-columns:1fr}
    .lead{grid-template-columns:46px minmax(0,1fr)}
    .lead .btns{grid-column:1/-1;justify-content:flex-start}
    .modal{padding:22px 18px 0}
    .modal .foot{margin:20px -18px 0;padding:12px 18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="radar-mark" aria-hidden="true"></div>
      <div>
        <span class="eyebrow">Hola, Lucía</span>
        <h1>Radar Lucía</h1>
      </div>
    </div>
    <div class="actions">
      <button id="btnSettings">Ajustes</button>
      <button id="btnImport">Importar empresas</button>
      <button id="btnSearch">Buscar en portales</button>
      <button class="primary" id="btnNew">+ Añadir oferta o empresa</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div class="funnel" id="funnel"></div>

  <div class="layout">
    <main>
      <div class="views" id="views">
        <button data-view="empresas" class="active">Mis empresas</button>
        <button data-view="ofertas" id="btnViewOfertas">Ofertas</button>
        <button data-view="email">Mi email</button>
      </div>

      <div id="viewEmpresas">
        <div class="toolbar">
          <input type="search" id="search" placeholder="Buscar por empresa, contacto o email…">
          <select id="fTipo">
            <option value="">Todos los puestos</option>
            <option value="cuentas">Cuentas</option>
            <option value="eventos">Eventos</option>
            <option value="marketing">Marketing en empresa</option>
          </select>
          <select id="fSector"><option value="">Todos los sectores</option></select>
          <button id="btnBatch">Envío por lotes</button>
        </div>
        <div class="tabs" id="tabs"></div>
        <div id="list"></div>
      </div>

      <div id="viewOfertas" hidden></div>
      <div id="viewEmail" hidden></div>
    </main>
    <aside id="side"></aside>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script>
(function(){
  var LS_LEADS = 'radarLucia.leads.v1';
  var LS_SET = 'radarLucia.settings.v1';

  var ESTADOS = [
    {key:'contacto', label:'Falta contacto'},
    {key:'pendiente', label:'Pendiente'},
    {key:'enviado', label:'Enviado'},
    {key:'respondio', label:'Respondió'},
    {key:'entrevista', label:'Entrevista'},
    {key:'descartado', label:'Descartado'}
  ];
  var TIPOS = {cuentas:'Cuentas', eventos:'Eventos', marketing:'Marketing en empresa'};
  var SECTORES = ['Agencia y publicidad','Eventos','Moda y retail','Tecnología','Consultoría','Otros'];
  function guessSector(txt){
    var t = String(txt||'').toLowerCase();
    if(/event|congres|incentive|\bmice\b|feria/.test(t)) return 'Eventos';
    if(/agenc|publicid|advertis|creativ|branding|comunicaci[oó]n|relaciones p[uú]blicas|social media|medios/.test(t)) return 'Agencia y publicidad';
    if(/moda|fashion|retail|lujo|textil|cosm[eé]tic|belleza/.test(t)) return 'Moda y retail';
    if(/tecnolog|software|digital|saas|startup|fintech/.test(t)) return 'Tecnología';
    if(/consult|auditor|asesor/.test(t)) return 'Consultoría';
    return 'Otros';
  }
  function leadSector(l){ return l.sector || guessSector([l.empresa,l.puesto_oferta,l.notas].join(' ')); }
  var GH_REPO = 'klyrexcorp-commits/radar-lucia';
  var PRESETS = ['ejecutivo de cuentas junior','asistente de cuentas agencia publicidad','coordinador de eventos','producción de eventos','asistente de marketing','marketing junior','comunicación y marketing'];

  // un único email, que ella escribe y se guarda solo; {empresa} se sustituye en cada envío
  var DEFAULT_SETTINGS = {
    gmail:'', gClientId:'',
    mail:{
      asunto:'Candidatura · Lucía Gómez',
      cuerpo:'Hola, equipo de {empresa}:\n\nMe llamo Lucía Gómez y soy técnico superior en Marketing y Publicidad. Me gustaría formar parte de vuestro equipo.\n\nHe trabajado en el departamento de cuentas de una agencia de marketing experiencial y eventos, donde coordiné eventos corporativos y la comunicación con proveedores. Además estoy cursando un máster en IA aplicada a negocios.\n\nTe adjunto mi CV. ¿Podríamos hablar unos minutos?\n\nUn saludo,\nLucía Gómez Barragán'
    }
  };

  var leads = load(LS_LEADS, []);
  var settings = mergeSettings(load(LS_SET, {}));
  delete settings.ghToken;   // el token de GitHub ya no se usa
  var tab = 'pendiente', q = '', fTipo = '';
  var pendingImport = [];

  // ofertas recogidas automáticamente (docs/offers.json) y lo que Lucía hizo con cada una
  var LS_OFF = 'radarLucia.offers.v1';
  var view = 'empresas', offers = [], offersMeta = null, offersErr = '';
  var offState = load(LS_OFF, {});
  var oF = {portal:'', sector:'', q:'', soloEmail:false, ocultas:true, min:50, fresh:false};
  var fSector = '', firstLoad = true;
  // Gmail: el CV adjunto vive solo en este navegador; el permiso de envío, solo en memoria
  var LS_CV = 'radarLucia.cv.v1';
  var cvData = load(LS_CV, null);
  var gToken = null, gEmail = '', gsiPromise = null;
  var bSel = {}, batchRun = {stop:false, ids:[]}, mailTimer = null;
  // Apify: el token vive solo en este navegador; las ofertas de búsquedas propias se guardan aparte
  var LS_APIFY = 'radarLucia.apify.v1', LS_MINE = 'radarLucia.mine.v1';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  // ---------- validación (evita emails con datos mal parseados) ----------
  function problemasBase(l){
    var p = [];
    if(!l.empresa || l.empresa.trim().length<2 || /^[\d\s.,]+$/.test(l.empresa)) p.push('El nombre de la empresa no parece válido: "'+(l.empresa||'')+'".');
    if(l.email && !EMAIL_RE.test(l.email)) p.push('El email no es válido: "'+l.email+'".');
    if(l.contacto && /\d/.test(l.contacto)) p.push('El contacto lleva números, revisa que sea un nombre: "'+l.contacto+'".');
    if(l.oferta_url && !/^https?:\/\//i.test(l.oferta_url)) p.push('El enlace de la oferta debe empezar por http:// o https://.');
    return p;
  }
  function problemasEnvio(l){
    var p = problemasBase(l);
    if(!l.email) p.push('Falta el email de contacto.');
    return p;
  }

  // ---------- ofertas y portales ----------
  function detectPortal(url){
    var h = ''; try{ h = new URL(url).hostname.replace(/^www\./,''); }catch(e){ return ''; }
    if(/linkedin\./.test(h)) return 'LinkedIn';
    if(/infojobs\./.test(h)) return 'InfoJobs';
    if(/indeed\./.test(h)) return 'Indeed';
    if(/google\./.test(h)) return 'Google Empleo';
    if(/jobtoday|tecnoempleo|glassdoor|jooble|trabajos\.com/.test(h)) return h.split('.')[0].replace(/^./,function(c){return c.toUpperCase();});
    return h;
  }
  function guessTipo(puesto){
    var s = String(puesto||'').toLowerCase();
    if(/event|producci|congres|azafat/.test(s)) return 'eventos';
    if(/marketing|comunic|social|content|contenido|brand|publicid/.test(s)) return 'marketing';
    return 'cuentas';
  }
  function portalUrl(p, kw, loc){
    var k = encodeURIComponent(kw), l = encodeURIComponent(loc);
    if(p==='linkedin') return 'https://www.linkedin.com/jobs/search/?keywords='+k+'&location='+l+'&f_TPR=r604800';
    if(p==='infojobs') return 'https://www.infojobs.net/jobsearch/search-results/list.xhtml?keyword='+k+(/madrid/i.test(loc)?'&provinceIds=33':'')+'&sinceDate=_7_DAYS';
    if(p==='indeed') return 'https://es.indeed.com/jobs?q='+k+'&l='+l+'&fromage=7';
    return 'https://www.google.com/search?q='+encodeURIComponent(kw+' empleo '+loc)+'&ibp=htl;jobs';
  }
  function fromCapture(d){
    var portal = detectPortal(d.url), titulo = String(d.titulo||'').replace(/^\(\d+\)\s*/,'').trim();
    var puesto = String(d.h1||'').trim(), empresa = String(d.sel||'').trim();
    if(portal==='LinkedIn' && titulo){
      var pr = titulo.split(' | ');
      if(pr.length>=3){ puesto = puesto || pr[0].trim(); empresa = empresa || pr[1].trim(); }
    }
    if(!puesto) puesto = titulo;
    return {oferta_url:d.url, portal:portal, puesto_oferta:puesto.slice(0,140), empresa:empresa.slice(0,100), tipo:guessTipo(puesto)};
  }
  function bookmarkletCode(){
    var base = location.href.split('#')[0];
    var js = "(function(){var h=document.querySelector('h1');var d={url:location.href,titulo:document.title,h1:h?h.innerText:'',sel:String(getSelection()).trim()};window.open("+JSON.stringify(base)+"+'#add='+encodeURIComponent(JSON.stringify(d)));})();";
    return 'javascript:'+js;
  }
  function contactLinks(l){

      '<a class="btn small" target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent('"'+l.empresa+'" selección recursos humanos email contacto')+'">Email en Google</a>';
    if(l.web) out += '<a class="btn small" target="_blank" rel="noopener" href="'+esc(/^https?:/i.test(l.web)?l.web:'https://'+l.web)+'">Su web</a>';
    return out;
  }
  // sustituye {empresa} (y {puesto}, si hay oferta) en el texto que escribió Lucía
  function fillMail(txt, l){
    return String(txt == null ? '' : txt)
      .replace(/\{empresa\}/g, (l.empresa||'').trim())

  function saveOff(){ try{ localStorage.setItem(LS_OFF, JSON.stringify(offState)); }catch(e){} }
  function isLeadUrl(url){ return leads.some(function(l){return l.oferta_url===url;}); }

  function loadOffers(){
    return fetch('offers.json', {cache:'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){ offers = d.offers || []; offersMeta = d; offersErr = ''; })
      .catch(function(){
        offers = []; offersMeta = null;
        offersErr = location.protocol==='file:'
          ? 'Las ofertas se leen desde la web publicada; abierta como archivo local no se pueden cargar.'
          : 'No se pudo cargar la lista de ofertas.';
      })
      .then(function(){
        mergeMine(); offers.forEach(prepOffer);
        if(offers.length) offersErr = '';
        if(firstLoad && !leads.length && offers.length) setView('ofertas');
        firstLoad = false;
        if(view==='ofertas') renderOfList();
        updateOffBadge(); renderList(); renderSide();
      });

  // emails de la propia oferta primero, y después los de contacto general de la web de la empresa
  function offerEmails(o){ return (o.emails || []).concat(o.emailsWeb || []); }

  function offerList(){
    var s = oF.q.trim().toLowerCase();
    return offers.filter(function(o){
      if(oF.ocultas && (offState[o.id] || isLeadUrl(o.url))) return false;
      if(oF.portal && o.portal!==oF.portal) return false;
      if(oF.sector && o.sector!==oF.sector) return false;
      if(oF.soloEmail && !offerEmails(o).length) return false;
      if(oF.fresh && !o.fresh) return false;
      if(o.encaje < oF.min) return false;
      if(!s) return true;
      return [o.puesto,o.empresa,o.ciudad].join(' ').toLowerCase().indexOf(s)!==-1;
    }).sort(function(a,b){ return b.encaje - a.encaje || String(b.fecha||'').localeCompare(String(a.fecha||'')); });
  }

  // ---------- buscar ofertas con Apify desde la app ----------
  function cleanTxt(s){ return String(s==null ? '' : s).replace(/\s+/g, ' ').trim(); }
  function money(n){ return isFinite(n) ? '$'+Number(n).toFixed(2).replace('.', ',') : '—'; }
  var MAIL_RE = /[a-z0-9._%+-]+@[a-z0-9-]+(?:\.[a-z0-9-]+)*\.[a-z]{2,}/gi;
  function extractMails(text){
    var ok = (String(text||'').match(MAIL_RE) || []).map(function(e){ return e.toLowerCase().replace(/[.,;]+$/, ''); })
      .filter(function(e){ return !/\.(png|jpe?g|gif|svg|webp)$/.test(e) && !/(no-?reply|example\.|sentry|wixpress)/.test(e); });
    return ok.filter(function(e, i){ return ok.indexOf(e)===i; }).slice(0, 3);
  }
  // encaje con el perfil de Lucía (marketing, cuentas y eventos, nivel junior) y por qué
  function scoreOffer(puesto, desc){
    var t = String(puesto||'').toLowerCase(), d = String(desc||'').toLowerCase(), n = 40, why = [];
    if(/cuentas|account|event|marketing|comunicaci|publicidad|brand|social media|community/.test(t)){ n += 25; why.push('encaja con cuentas, eventos o marketing'); }
    if(/junior|jr\b|pr[aá]cticas|becari|asistente|auxiliar|trainee|coordinador/.test(t)){ n += 15; why.push('nivel junior o de entrada'); }
    if(/senior|sr\b|director|jefe|responsable|manager|head|l[ií]der|gerente/.test(t)){ n -= 40; why.push('puesto sénior o de dirección'); }
    if(/desarrollador|developer|ingenier|programador|contable|contabilidad|financ|log[ií]stic|conductor|enfermer|comercial|ventas|electric/.test(t)){ n -= 50; why.push('área distinta a la tuya'); }
    if(/payable|receivable|facturaci|auditor|tesorer|fiscal|n[oó]min|recursos humanos|rrhh/.test(t)){ n -= 50; why.push('contabilidad o administración'); }
    if(/(\+|m[aá]s de|m[ií]nimo|minimo)\s*[3-9]\s*a[nñ]os/.test(d)){ n -= 20; why.push('pide varios años de experiencia'); }
    return {n: Math.max(0, Math.min(100, n)), why: why};
  }
  function prepOffer(o){
    o.sector = guessSector([o.empresa, o.puesto, o.resumen].join(' '));
    o.why = scoreOffer(o.puesto, o.resumen).why;
  }
  function mergeMine(){
    var ids = {}; offers.forEach(function(o){ ids[o.id] = 1; });
    mine.forEach(function(o){ if(!ids[o.id]){ o.mine = true; offers.push(o); } });
  }
  function saveMine(){
    try{ localStorage.setItem(LS_MINE, JSON.stringify(offers.filter(function(o){ return o.mine; }).slice(-600).map(function(o){ var c = Object.assign({}, o); delete c.fresh; return c; }))); }catch(e){}
  }

  // qué actores se usan y cuánto cuesta cada resultado (precios publicados por sus autores)
  var APIFY_SRC = {
    infojobs:{label:'InfoJobs', actor:'scrapesage~infojobs-scraper', price:0.00165,
      input:function(s){
        var i = {searchQueries:[s.query], sortBy:'PUBLICATION_DATE', includeDescription:true, maxDaysOld:s.days, maxResults:s.n};
        if(/madrid/i.test(s.location)) i.provinces = ['33']; else i.cities = [s.location];
        if(s.days <= 7) i.postedWithin = '_7_DAYS';
        return i;
      },
      norm:function(it){
        if(it.recordType && it.recordType!=='jobOffer') return null;
        return {id:'infojobs:'+it.offerId, puesto:it.title, empresa:it.companyName, ciudad:it.city, url:it.url, fecha:it.publishedAt, salario:it.salaryText, modalidad:it.teleworking, desc:it.description};
      }},
    indeed:{label:'Indeed', actor:'unfenced-group~indeed-es-scraper', price:0.0007,
      input:function(s){
        var f = [1,3,7,14].filter(function(x){ return x >= s.days; })[0] || 14;
        return {query:s.query, location:s.location, radius:25, sort:'date', fromDays:String(f), maxItems:s.n};
      },
      norm:function(it){
        var loc = it.location || {};
        return {id:'indeed:'+it.jobKey, puesto:it.title, empresa:it.companyName, ciudad:loc.city || loc.raw, url:it.jobUrl, fecha:it.datePublished, salario:it.salary && it.salary.salaryText, modalidad:loc.isRemote ? 'Remoto' : '', desc:it.descriptionText};
      }},
    linkedin:{label:'LinkedIn', actor:'gopalakrishnan~linkedin-jobs', price:0.00035,
      input:function(s){ return {keywords:s.query, location:s.location+', Spain', maxResults:s.n}; },
      norm:function(it){
        var url = String(it.jobUrl||'').split('?')[0], num = (url.match(/(\d{6,})\/?$/) || [])[1];
        return {id:'linkedin:'+(num || url), puesto:it.title, empresa:it.company, ciudad:it.location, url:url, fecha:it.postedDate, salario:'', modalidad:'', desc:''};
      }}
  };
  function toOffer(o, portal){
    var desc = cleanTxt(o.desc), puesto = cleanTxt(o.puesto), sc = scoreOffer(puesto, desc);
    return {id:o.id, portal:portal, puesto:puesto, empresa:cleanTxt(o.empresa), ciudad:cleanTxt(o.ciudad), url:o.url, fecha:o.fecha || null,
      salario:cleanTxt(o.salario), modalidad:cleanTxt(o.modalidad), web:'', webFuente:'', emails:extractMails(o.desc), emailsWeb:[],
      tipo:guessTipo(puesto), encaje:sc.n, resumen:desc.slice(0, 400), mine:true, first_seen:nowISO()};
  }

  // entiende lo que escribe: puesto, ciudad («en Madrid») y antigüedad («última semana»)
  var CIUDADES = ['madrid','barcelona','valencia','sevilla','zaragoza','malaga','bilbao','alicante','murcia','palma','a coruna','vigo','valladolid','granada','pozuelo de alarcon','alcobendas','las rozas','getafe','mostoles','alcala de henares','leganes','majadahonda','boadilla del monte','torrejon de ardoz','san sebastian','santander','oviedo','gijon','cordoba','toledo'];
  function parseSearch(text){
    var t = ' '+cleanTxt(text)+' ', days = 7;
    // \b de JavaScript no entiende acentos: se usan lookarounds con letras españolas
    var WHEN = /[,;]?\s*(?<![\wáéíóúñÁÉÍÓÚÑ])(hoy|ayer|[uú]ltimas? 24 ?h(?:oras)?|24 ?h|[uú]ltimos? 3 d[ií]as|(?:[uú]ltima|esta) semana|7 d[ií]as|15 d[ií]as|14 d[ií]as|quincena|[uú]ltimas? dos semanas|(?:[uú]ltimo|este) mes|30 d[ií]as)(?![\wáéíóúñÁÉÍÓÚÑ])/ig;
    var w = t.match(WHEN);
    if(w){
      var x = w.join(' ').toLowerCase();
      days = /hoy|ayer|24/.test(x) ? 1 : /3 d/.test(x) ? 3 : /semana|7 d/.test(x) && !/dos/.test(x) ? 7 : /mes|30/.test(x) ? 30 : 14;
      t = t.replace(WHEN, ' ');
    }
    var loc = 'Madrid';
    var m = t.match(/\s(?:en|por)\s+([A-Za-zÁÉÍÓÚÜÑáéíóúüñ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ' -]{1,40}?)\s*(?:[,.]|$)/);
    if(m){
      var cand = cleanTxt(m[1]), plain = cand.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if(CIUDADES.indexOf(plain) >= 0 || /^[A-ZÁÉÍÓÚÑ]/.test(cand)){ loc = cand; t = t.replace(m[0], ' '); }
    }
    var query = cleanTxt(t.replace(/\b(busco|buscar|buscame|ofertas? de|trabajo de|empleo de)\b/ig, ' ').replace(/[,;.]+/g, ' '));
    return {query:query, location:loc, days:days};
  }
  function daysText(d){ return d<=1 ? 'de las últimas 24 horas' : d===3 ? 'de los últimos 3 días' : d===7 ? 'de la última semana' : d===14 ? 'de las últimas dos semanas' : 'del último mes'; }
  function pickedSources(){ return Object.keys(APIFY_SRC).filter(function(k){ var c = $('a_p_'+k); return c && c.checked; }); }
  function estimateCost(picks, n){ return Math.max(0.01, picks.reduce(function(a, k){ return a + APIFY_SRC[k].price*n; }, 0)); }

  function searchBoxHtml(){

      '<div class="hint">Escribe lo que buscas como lo dirías: puesto, ciudad y desde cuándo. Busco en InfoJobs, LinkedIn e Indeed con tu cuenta de Apify y las sumo a la lista.</div>'+
      '<div class="searchrow"><input id="a_q" type="search" autocomplete="off" placeholder="Ej.: coordinadora de eventos junior en Madrid, última semana">'+
      '<button class="primary" id="a_go" data-act="aSearch">Buscar</button></div>'+
      '<div class="sugs" id="a_sug"></div>'+
      '<div class="hint" id="a_interp" style="margin-top:12px"></div>'+
      '<div class="aopts"><label><input type="checkbox" id="a_p_infojobs" checked> InfoJobs</label>'+
      '<label><input type="checkbox" id="a_p_linkedin" checked> LinkedIn</label>'+
      '<label><input type="checkbox" id="a_p_indeed" checked> Indeed</label>'+

  }
  function initSearch(){
    $('a_sug').innerHTML = PRESETS.map(function(p){ return '<button class="chipbtn" data-act="aSug" data-q="'+esc(p+' en Madrid')+'">'+esc(p)+'</button>'; }).join('');

  function updateInterp(){
    var box = $('a_interp'); if(!box) return;
    var s = parseSearch($('a_q').value), picks = pickedSources(), n = Number($('a_n').value);
    if(!s.query){ box.textContent = 'Prueba con un puesto, y si quieres la ciudad y cuándo: «coordinador de eventos junior en Madrid, última semana».'; return; }
    box.innerHTML = 'Buscaré <strong>«'+esc(s.query)+'»</strong> en <strong>'+esc(s.location)+'</strong>, '+daysText(s.days)+', en '+picks.length+' '+plural(picks.length,'portal','portales')+
      ' (hasta '+n+' ofertas en cada uno). Coste estimado: <strong>'+money(estimateCost(picks, n))+'</strong>.';
  }

  function renderUsage(){
    var u = $('a_usage'); if(!u) return;
    if(!apifyToken){ u.innerHTML = '<div class="alert warn">Para buscar desde aquí, añade tu token de Apify. <button class="small" data-act="openSettings">Abrir Ajustes</button></div>'; return; }
    if(!usage){ u.innerHTML = '<div class="hint" style="margin-top:12px">Consultando el uso de Apify…</div>'; return; }
    if(usage.err){ u.innerHTML = '<div class="alert bad">'+esc(usage.err)+'</div>'; return; }
    var pct = usage.max > 0 ? Math.min(100, Math.round(usage.cur/usage.max*100)) : 0;
    u.innerHTML = '<div class="usage"><div class="ut"><span>Uso de Apify este mes</span><span><strong>'+money(usage.cur)+'</strong> de '+money(usage.max)+'</span></div>'+
      '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>'+
      '<div class="hint">Te quedan '+money(Math.max(0, usage.max-usage.cur))+(usage.end ? ' hasta el '+fmt(usage.end) : '')+'. <button class="small" data-act="aUsage">Actualizar</button></div></div>';
  }
  function fetchUsage(){
    if(!apifyToken){ usage = null; renderUsage(); return Promise.resolve(); }
    return fetch('https://api.apify.com/v2/users/me/limits', {headers:{Authorization:'Bearer '+apifyToken}})
      .then(function(r){ if(!r.ok){ var e = new Error('Error '+r.status); e.status = r.status; throw e; } return r.json(); })
      .then(function(j){
        var d = j.data || {};
        usage = {cur:Number(d.current && d.current.monthlyUsageUsd), max:Number(d.limits && d.limits.maxMonthlyUsageUsd), end:d.monthlyUsageCycle && d.monthlyUsageCycle.endAt, err:''};
        usageAt = Date.now(); renderUsage();
      })
      .catch(function(e){
        usage = {err: e.status===401 ? 'El token de Apify no es válido. Revísalo en Ajustes.' : 'No se pudo consultar el uso de Apify.'};
        renderUsage();
      });
  }
  function refreshUsage(){ if(apifyToken && (!usage || Date.now()-usageAt > 60000)) fetchUsage(); else renderUsage(); }
  function setApifyToken(t){
    apifyToken = t; usage = null;
    try{ if(t) localStorage.setItem(LS_APIFY, t); else localStorage.removeItem(LS_APIFY); }catch(e){}
  }

  function runActorBrowser(src, s){
    var ctl = new AbortController(), timer = setTimeout(function(){ ctl.abort(); }, 285000);
    return fetch('https://api.apify.com/v2/acts/'+src.actor+'/run-sync-get-dataset-items?format=json&clean=true', {
      method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+apifyToken}, body:JSON.stringify(src.input(s)), signal:ctl.signal
    }).then(function(r){
      clearTimeout(timer);
      if(r.ok) return r.json();
      return r.json().catch(function(){ return {}; }).then(function(j){
        var msg = r.status===401 ? 'El token de Apify no es válido.' : r.status===402 ? 'No queda crédito en Apify.' :
          r.status===403 ? 'Apify ha rechazado la petición (permisos o límite de uso).' : ((j.error && j.error.message) || ('Error '+r.status));
        var e = new Error(msg); e.status = r.status; throw e;
      });
    }, function(err){
      clearTimeout(timer);
      throw new Error(err && err.name==='AbortError' ? 'Tardó más de 4 minutos y se canceló.' : 'No se pudo conectar con Apify.');
    });
  }

  function runSearch(){
    if(!apifyToken){ settingsModal(); return; }
    var s = parseSearch($('a_q').value), picks = pickedSources(), prog = $('a_prog');
    if(!s.query){ prog.innerHTML = '<div class="alert warn">Escribe qué puesto buscas.</div>'; return; }
    if(!picks.length){ prog.innerHTML = '<div class="alert warn">Marca al menos un portal.</div>'; return; }
    s.n = Number($('a_n').value);
    var est = estimateCost(picks, s.n);
    if(usage && !usage.err && usage.max - usage.cur < est &&
       !confirm('Te quedan '+money(Math.max(0, usage.max-usage.cur))+' en Apify y esta búsqueda cuesta unos '+money(est)+'. ¿Probar igualmente?')) return;
    var before = usage && !usage.err ? usage.cur : null;
    $('a_go').disabled = true;
    prog.innerHTML = picks.map(function(k){ return '<div class="srow" id="ap_'+k+'">… '+esc(APIFY_SRC[k].label)+' (buscando)</div>'; }).join('');
    offers.forEach(function(o){ delete o.fresh; });
    Promise.all(picks.map(function(k){
      var src = APIFY_SRC[k];
      return runActorBrowser(src, s).then(function(items){ return {k:k, items:items}; }, function(err){ return {k:k, err:err}; });
    })).then(function(res){
      var found = 0, added = 0, good = 0, fails = 0;
      res.forEach(function(r){
        var src = APIFY_SRC[r.k], row = $('ap_'+r.k);
        if(r.err){ fails++; if(row){ row.className = 'srow err'; row.textContent = '✗ '+src.label+': '+r.err.message; } return; }
        var n = 0;
        (r.items || []).forEach(function(it){
          var raw = src.norm(it);
          if(!raw || !raw.id || !raw.url || !cleanTxt(raw.puesto) || !cleanTxt(raw.empresa)) return;
          n++; found++;
          var o = toOffer(raw, src.label);
          if(offers.some(function(x){ return x.id===o.id; })) return;
          prepOffer(o); o.fresh = true; offers.push(o); added++; if(o.encaje >= 50) good++;
        });
        if(row){ row.className = 'srow ok'; row.textContent = '✓ '+src.label+': '+n+' ofertas'; }
      });
      saveMine();
      if(added){ oF.fresh = true; oF.min = 0; var mn = $('o_min'); if(mn) mn.value = '0'; }
      $('a_go').disabled = false;
      return fetchUsage().then(function(){
        var cost = before!=null && usage && !usage.err ? Math.max(0, usage.cur - before) : null;
        prog.insertAdjacentHTML('beforeend', '<div class="alert '+(fails && !added ? 'bad' : 'ok')+'">'+
          (found ? found+' ofertas encontradas, '+added+' nuevas para ti ('+good+' con buen encaje).' : 'No encontré ofertas con esa búsqueda.')+
          (cost!=null ? ' Coste real: '+money(cost)+'.' : '')+'</div>');
        renderOfList(); updateOffBadge(); renderSide();
      });
    });
  }

  // devuelve 'ok', 'dup' (mismo email que otra empresa) o 'bad' (datos no válidos)
  function saveOffer(o){
    if(isLeadUrl(o.url)){ offState[o.id] = 'guardada'; return 'ok'; }
    var email = offerEmails(o)[0] || '';
    var l = {id:uid(), estado:email?'pendiente':'contacto', created_at:nowISO(), empresa:o.empresa, contacto:'', cargo:'',
      email:email, tipo:o.tipo, sector:o.sector, web:o.web||'', fuente:'Ofertas', notas:'', oferta_url:o.url, puesto_oferta:o.puesto, portal:o.portal};
    if(problemasBase(l).length) return 'bad';
    if(email && leads.some(function(x){ return x.email===email; })) return 'dup';
    leads.unshift(l); offState[o.id] = 'guardada';
    return 'ok';
  }

  function saveLead(id){
    var data = {
      empresa:$('f_empresa').value.trim(), contacto:$('f_contacto').value.trim(), cargo:$('f_cargo').value.trim(),
      email:$('f_email').value.trim().toLowerCase(), tipo:$('f_tipo').value, web:$('f_web').value.trim(),
      fuente:$('f_fuente').value.trim(), notas:$('f_notas').value.trim(),
      oferta_url:$('f_url').value.trim(), puesto_oferta:$('f_puesto').value.trim(), sector:$('f_sector').value
    };
    data.portal = detectPortal(data.oferta_url);
    var p = problemasBase(data);
    if(p.length){ $('f_err').innerHTML = '<div class="alert bad">'+p.map(esc).join('<br>')+'</div>'; return; }
    var dup = data.email ? leads.filter(function(l){return l.email===data.email && l.id!==id;})[0] : null;
    if(dup){ $('f_err').innerHTML = '<div class="alert bad">Ya existe una empresa con ese email: '+esc(dup.empresa)+'.</div>'; return; }

  // ---------- Gmail: conexión (OAuth), CV adjunto y envío ----------
  var SEND_SCOPE = 'https://www.googleapis.com/auth/gmail.send openid email';

  function loadGsi(){
    if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if(!gsiPromise) gsiPromise = new Promise(function(res, rej){
      var s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = res;
      s.onerror = function(){ gsiPromise = null; rej(new Error('No se pudo cargar el acceso de Google.')); };
      document.head.appendChild(s);
    });
    return gsiPromise;
  }
  function gValid(){ return !!(gToken && Date.now() < gToken.exp); }

  // Hay que llamarla desde un clic: abre la ventana de Google para dar permiso de envío
  function gConnect(){
    if(!settings.gClientId) return Promise.reject(new Error('Falta el ID de cliente de Google en Ajustes.'));
    return loadGsi().then(function(){
      return new Promise(function(res, rej){
        google.accounts.oauth2.initTokenClient({
          client_id: settings.gClientId, scope: SEND_SCOPE, hint: settings.gmail || undefined,
          callback: function(r){
            if(r.error){ rej(new Error(r.error_description || r.error)); return; }
            gToken = {t:r.access_token, exp:Date.now() + (Number(r.expires_in)||3600)*1000 - 60000};
            res();
          },
          error_callback: function(e){
            rej(new Error(e && e.type==='popup_closed' ? 'Cerraste la ventana de Google sin dar permiso.' : 'No se pudo abrir la ventana de Google (¿bloqueador de ventanas?).'));
          }
        }).requestAccessToken();
      });
    }).then(function(){
      return fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer '+gToken.t}}).then(function(r){ return r.json(); });
    }).then(function(u){ gEmail = String(u.email||'').toLowerCase(); return gEmail; });
  }
  function ensureGmail(){ return gValid() ? Promise.resolve(gEmail) : gConnect(); }

  function b64(bytes){
    var s = '';
    for(var i=0; i<bytes.length; i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
    return btoa(s);
  }
  function utf8(str){ return new TextEncoder().encode(str); }
  function wrap76(s){ return s.replace(/(.{76})/g, '$1\r\n'); }
  function mimeSubject(s){ return /^[\x20-\x7e]*$/.test(s) ? s : '=?UTF-8?B?'+b64(utf8(s))+'?='; }

  // mensaje MIME (texto + PDF opcional) codificado para la API de Gmail
  function buildRaw(to, subject, body, attach){
    var nl = '\r\n', bd = 'radar'+Math.random().toString(36).slice(2)+Date.now().toString(36);
    var head = 'To: '+to+nl+'Subject: '+mimeSubject(subject)+nl+'MIME-Version: 1.0'+nl;
    var text = 'Content-Type: text/plain; charset="UTF-8"'+nl+'Content-Transfer-Encoding: base64'+nl+nl+
      wrap76(b64(utf8(body.replace(/\r?\n/g, nl))))+nl;
    var msg = !attach ? head+text
      : head+'Content-Type: multipart/mixed; boundary="'+bd+'"'+nl+nl+
        '--'+bd+nl+text+
        '--'+bd+nl+'Content-Type: application/pdf; name="'+attach.name+'"'+nl+
        'Content-Disposition: attachment; filename="'+attach.name+'"'+nl+'Content-Transfer-Encoding: base64'+nl+nl+
        wrap76(attach.b64)+nl+'--'+bd+'--'+nl;
    return b64(utf8(msg)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function sendMail(to, subject, body){
    return fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
      method:'POST',
      headers:{Authorization:'Bearer '+gToken.t, 'Content-Type':'application/json'},
      body: JSON.stringify({raw: buildRaw(to, subject, body, cvData)})
    }).then(function(r){
      if(r.ok) return r.json();
      return r.json().catch(function(){ return {}; }).then(function(j){
        var e = new Error((j.error && j.error.message) || ('Error '+r.status)); e.status = r.status; throw e;
      });
    });
  }

  function readCv(file){
    if(!file) return;
    if(file.size > 3*1024*1024){ alert('El PDF pesa más de 3 MB. Comprímelo antes de adjuntarlo.'); return; }
    var r = new FileReader();
    r.onload = function(){
      var name = file.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._ -]/g, '_');
      cvData = {name:name, size:file.size, b64:b64(new Uint8Array(r.result))};
      try{ localStorage.setItem(LS_CV, JSON.stringify(cvData)); }catch(e){ alert('No se pudo guardar el PDF en este navegador.'); }
      gStatus();
      if(view==='email') renderMailChecks();
    };
    r.readAsArrayBuffer(file);
  }

  function parseImport(){
    var txt = $('i_text').value.trim(), rows = [], bad = [];
    pendingImport = [];
    if(!txt){ importModal('Pega al menos una fila.'); return; }
    txt.split(/\r?\n/).forEach(function(line, i){
      if(!line.trim()) return;
      var d = line.indexOf('\t')>-1 ? '\t' : (line.indexOf(';')>-1 ? ';' : ',');
      var c = line.split(d).map(function(x){return x.trim();});
      if(i===0 && /^empresa$/i.test(c[0])) return;
      var tipo = (c[4]||'').toLowerCase(); if(!TIPOS[tipo]) tipo = 'cuentas';
      var r = {empresa:c[0]||'', contacto:c[1]||'', cargo:c[2]||'', email:(c[3]||'').toLowerCase(), tipo:tipo, web:c[5]||''};
      var p = problemasEnvio(r);
      if(p.length) bad.push('Fila '+(i+1)+': '+p[0]); else rows.push(r);
    });
    var seen = {}; leads.forEach(function(l){seen[l.email]=1;});
    pendingImport = rows.filter(function(r){ if(seen[r.email]) return false; seen[r.email]=1; return true; });
    var skipped = rows.length - pendingImport.length;
    var msg = '';
    if(bad.length) msg += 'Filas descartadas:<br>'+bad.slice(0,6).map(esc).join('<br>');
    if(skipped) msg += (msg?'<br>':'')+skipped+' repetidas (mismo email).';
    importModal(msg);
    if(pendingImport.length===0 && !msg) importModal('No se encontró ninguna fila válida.');
  }

    openModal('<h2>Enviando…</h2><div class="hint" id="s_prog"></div>'+
      '<div class="blist" style="max-height:320px" id="s_rows">'+ids.map(function(id){
        var l = byId(id); return '<div class="srow" id="sr_'+esc(id)+'">○ '+esc(l ? l.empresa : '?')+'</div>';
      }).join('')+'</div>'+
      '<div class="foot"><button id="s_stop" data-act="autoStop">Parar</button></div>');
    function row(id, cls, txt){ var r = $('sr_'+id); if(r){ r.className = 'srow '+cls; r.textContent = txt; } }
    function finish(){
      var left = ids.length - i;
      if(sent) tab = 'enviado';
      save(); render();
      openModal('<h2>Envío terminado</h2><div class="alert '+(failed||reason?'warn':'ok')+'">'+sent+' enviados, '+failed+' con error'+(left>0?', '+left+' sin enviar':'')+'.</div>'+
        (reason ? '<div class="alert bad">'+esc(reason)+'</div>' : '')+
        '<div class="foot"><button class="primary" data-act="close">Cerrar</button></div>');
    }
    function step(){
      if(run.stop){ if(!reason) reason = 'Envío parado.'; return finish(); }
      if(i >= ids.length) return finish();
      var id = ids[i++], l = byId(id);
      if(!l || l.estado !== 'pendiente'){ row(id, '', '– '+(l ? l.empresa : '?')+' (omitida: ya no está pendiente)'); return step(); }
      var m = composeFor(l);
      if($('s_prog')) $('s_prog').textContent = 'Enviando '+i+' de '+ids.length+'…';
      row(id, '', '… '+l.empresa+' (enviando)');
      sendMail(l.email, m.subject, m.body).then(function(){
        markSent(l); save(); sent++; row(id, 'ok', '✓ '+l.empresa+' · '+l.email);
      }).catch(function(e){
        failed++; row(id, 'err', '✗ '+l.empresa+' · '+e.message);
        if(e.status===401 || e.status===403 || e.status===429){
          reason = e.status===401 ? 'Google ha cerrado la conexión: vuelve a conectar Gmail en Ajustes y reanuda con las que falten.' : 'Gmail ha rechazado el envío ('+e.message+'). Se ha parado para no empeorarlo.';
          run.stop = true; gToken = null;
        }
      }).then(function(){
        if(run.stop || i >= ids.length) return finish();
        setTimeout(step, delay);
      });
    }
    step();
  }
  function download(name, text){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text],{type:'application/json'}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------- eventos ----------
  document.getElementById('btnNew').onclick = function(){ leadForm(); };
  document.getElementById('btnSettings').onclick = settingsModal;
  document.getElementById('btnImport').onclick = function(){ pendingImport = []; importModal(); };
  document.getElementById('btnSearch').onclick = searchModal;
  document.getElementById('btnBatch').onclick = batchModal;
  SECTORES.forEach(function(s){ var o = document.createElement('option'); o.textContent = s; document.getElementById('fSector').appendChild(o); });
  document.getElementById('fSector').onchange = function(e){ fSector = e.target.value; renderList(); };
  document.addEventListener('input', onMailInput);
  function onSearchField(e){ var id = e.target.id; if(id==='a_q' || id==='a_n' || /^a_p_/.test(id)) updateInterp(); }
  document.addEventListener('input', onSearchField);
  document.addEventListener('change', onSearchField);
  document.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='a_q'){ e.preventDefault(); runSearch(); } });
  function onBatchField(e){
    var t = e.target;
    if(/^b_(sector|tipo)$/.test(t.id)) batchRender();
    else if(t.dataset && t.dataset.bid){ bSel[t.dataset.bid] = t.checked; batchInfo(); }
    else if(t.id==='b_ok') $('b_go').disabled = !t.checked;
    else if(t.id==='s_cvfile') readCv(t.files[0]);
  }
  document.addEventListener('change', onBatchField);
  el.search.oninput = function(){ q = el.search.value; renderList(); };
  el.fTipo.onchange = function(){ fTipo = el.fTipo.value; renderList(); };
  el.overlay.addEventListener('mousedown', function(e){ if(e.target===el.overlay) closeModal(); });

  el.tabs.addEventListener('click', function(e){
    var b = e.target.closest('[data-tab]'); if(!b) return;
    tab = b.dataset.tab; render();
  });

  el.list.addEventListener('change', function(e){
    if(e.target.dataset.act!=='estado') return;
    var l = byId(e.target.dataset.id); if(!l) return;
    l.estado = e.target.value;
    if(l.estado==='pendiente') l.enviado_at = null;
    save(); render();
  });

  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if(!b || b.tagName==='SELECT') return;
    var act = b.dataset.act, id = b.dataset.id, l = id ? byId(id) : null;
    if(act==='close') closeModal();
    else if(act==='edit' && l) leadForm(l);
    else if(act==='del' && l){
      if(confirm('¿Borrar '+l.empresa+'?')){
        leads = leads.filter(function(x){return x.id!==id;});
        offers.forEach(function(x){ if(x.url===l.oferta_url) delete offState[x.id]; });
        save(); saveOff(); render();
      }
    }
    else if(act==='mail' && l) composeModal(l);
    else if(act==='saveLead') saveLead(id);
    else if(act==='saveSettings') saveSettings();
    else if(act==='copy'){
      var txt = 'Asunto: '+$('c_asunto').value+'\n\n'+$('c_cuerpo').value;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function(){ b.textContent='Copiado'; }, function(){ $('c_cuerpo').select(); });
    }
    else if(act==='gmail' && l){
      window.open(gmailUrl(l), '_blank', 'noopener');
      $('c_after').innerHTML = '<div class="alert warn">Cuando lo hayas enviado desde Gmail, márcalo aquí: <button class="small primary" data-act="sent" data-id="'+l.id+'">Ya lo he enviado</button></div>';
    }
    else if(act==='sent' && l){ markSent(l); tab = 'enviado'; save(); closeModal(); render(); }
    else if(act==='openSettings') settingsModal();
    else if(act==='export') download('radar-lucia-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify({leads:leads,settings:settings},null,2));
    else if(act==='importJson') $('s_file').click();
    else if(act==='portal'){
      var kw = $('q_custom').value.trim() || $('q_pre').value, loc = $('q_loc').value.trim() || 'Madrid';
      window.open(portalUrl(b.dataset.p, kw, loc), '_blank', 'noopener');
    }
    else if(act==='offSave'){
      var o = offerById(id); if(!o) return;
      var r = saveOffer(o);
      if(r==='ok'){ save(); saveOff(); render(); }
      else alert(r==='dup' ? 'Ya tienes otra empresa con ese mismo email. Revísala en «Mis empresas».' : 'Los datos de esta oferta no son válidos para guardarla.');
    }
    else if(act==='offImport50') importMore(50);
    else if(act==='offRun') runWorkflow('fetch-offers.yml', 'Esto vuelve a recoger ofertas con Apify y gasta crédito (unos 0,5 $). ¿Seguir?');
    else if(act==='offEmails') runWorkflow('buscar-emails.yml', 'Esto busca la web y el email de contacto de hasta 60 empresas con Apify (unos 0,1 $). ¿Seguir?', {max:'60'});
    else if(act==='goOfertas') setView('ofertas');
    else if(act==='batchOpen') batchModal();
    else if(act==='aSearch') runSearch();
    else if(act==='aSug'){ $('a_q').value = b.dataset.q; updateInterp(); $('a_q').focus(); }
    else if(act==='aUsage'){ usage = null; renderUsage(); fetchUsage(); }
    else if(act==='aAll'){ oF.fresh = false; renderOfList(); }
    else if(act==='aTest'){
      setApifyToken($('s_apify').value.trim());
      $('a_status').textContent = 'Comprobando…';
      fetchUsage().then(function(){
        $('a_status').textContent = !apifyToken ? 'Pega primero tu token.' : (usage && !usage.err ? 'Conectado. Uso este mes: '+money(usage.cur)+' de '+money(usage.max)+'.' : (usage ? usage.err : ''));
      });
    }
    else if(act==='aClear'){ setApifyToken(''); $('s_apify').value = ''; $('a_status').textContent = 'Token quitado de este navegador.'; }
    else if(act==='goContacto'){ tab = 'contacto'; setView('empresas'); render(); }
    else if(act==='bAll'){ batchFiltered().forEach(function(x){ bSel[x.id] = true; }); batchRender(); }
    else if(act==='bNone'){ bSel = {}; batchRender(); }
    else if(act==='batch') batchModal();
    else if(act==='autoPrep') autoPrepare();
    else if(act==='autoGo') autoStart();
    else if(act==='autoStop'){ batchRun.stop = true; b.disabled = true; b.textContent = 'Parando…'; }
    else if(act==='gConnect'){
      settings.gClientId = $('s_gcid').value.trim(); settings.gmail = $('s_gmail').value.trim(); save();
      $('g_status').textContent = 'Abriendo la ventana de Google…';
      gConnect().then(function(email){
        gStatus();
        if(settings.gmail && email !== settings.gmail.toLowerCase()) $('g_status').textContent += ' Ojo: en Ajustes el Gmail es '+settings.gmail+'.';
      }).catch(function(err){ $('g_status').textContent = 'No se pudo conectar: '+err.message; });
    }
    else if(act==='gTest'){
      settings.gClientId = $('s_gcid').value.trim(); settings.gmail = $('s_gmail').value.trim(); save();
      $('g_status').textContent = 'Enviando prueba…';
      ensureGmail().then(function(email){
        var m = composeFor({empresa:'Empresa de prueba'});
        return sendMail(email, '[PRUEBA] '+m.subject, m.body).then(function(){
          $('g_status').textContent = 'Prueba enviada a '+email+(cvData ? ' con el CV adjunto.' : ' (sin CV adjunto).');
        });
      }).catch(function(err){ $('g_status').textContent = 'No se pudo enviar la prueba: '+err.message; });
    }
    else if(act==='sendNow' && l){
      var subj = $('c_asunto').value, body = $('c_cuerpo').value;
      if(!confirm('¿Enviar este email a '+l.email+' ahora desde Gmail'+(cvData ? ' con el CV adjunto' : '')+'?')) return;
      b.disabled = true; $('c_after').innerHTML = '<div class="alert warn">Enviando…</div>';
      ensureGmail().then(function(){ return sendMail(l.email, subj, body); }).then(function(){
        markSent(l); tab = 'enviado'; save(); closeModal(); render();
      }).catch(function(err){ b.disabled = false; $('c_after').innerHTML = '<div class="alert bad">No se pudo enviar: '+esc(err.message)+'</div>'; });
    }
    else if(act==='offHide'){ offState[id] = 'descartada'; saveOff(); renderOfList(); updateOffBadge(); }
    else if(act==='offSaveMail'){
      var cand = offerList().filter(function(x){ return offerEmails(x).length && !offState[x.id] && !isLeadUrl(x.url); });
      if(!cand.length || !confirm('Guardar '+cand.length+' ofertas con email en «Pendiente»? No se envía nada: tú revisas y envías cada una.')) return;
      var okN = 0, skipN = 0;
      cand.forEach(function(x){ if(saveOffer(x)==='ok') okN++; else skipN++; });
      save(); saveOff(); render();
      alert(okN+' guardadas'+(skipN ? ', '+skipN+' omitidas (email repetido o datos no válidos).' : '.'));
    }
    else if(act==='parse') parseImport();
    else if(act==='doImport') doImport();
  });

  document.getElementById('funnel').addEventListener('click', function(e){
    var b = e.target.closest('[data-tab]'); if(!b) return;
    tab = b.dataset.tab; setView('empresas'); render();
  });
  document.getElementById('views').addEventListener('click', function(e){
    var b = e.target.closest('[data-view]'); if(b) setView(b.dataset.view);
  });
  function onOfferFilter(e){
    var id = e.target.id;
    if(id==='o_q') oF.q = e.target.value;
    else if(id==='o_portal') oF.portal = e.target.value;
    else if(id==='o_sector') oF.sector = e.target.value;
    else if(id==='o_min') oF.min = Number(e.target.value);
    else if(id==='o_email') oF.soloEmail = e.target.checked;
    else if(id==='o_hide') oF.ocultas = e.target.checked;
    else return;
    renderOfList();
  }
  document.addEventListener('input', onOfferFilter);
  document.addEventListener('change', onOfferFilter);

  document.addEventListener('change', function(e){
    if(e.target.id!=='s_file') return;
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(r.result);
        if(!Array.isArray(d.leads)) throw new Error();
        if(!confirm('Esto reemplaza los datos actuales por la copia ('+d.leads.length+' empresas). ¿Seguir?')) return;
        leads = d.leads; settings = mergeSettings(d.settings); delete settings.ghToken; save(); closeModal(); render();
      }catch(err){ alert('El archivo no es una copia válida.'); }
    };
    r.readAsText(f);
  });

  render();
  loadOffers();

  // oferta enviada desde el marcador: #add=<json>
  if(location.hash.indexOf('#add=')===0){
    try{
      var d = JSON.parse(decodeURIComponent(location.hash.slice(5)));
      history.replaceState(null, '', location.pathname + location.search);
      if(d && /^https?:\/\//i.test(d.url||'')) leadForm(fromCapture(d));
    }catch(err){}
  }
})();
</script>
</body>
